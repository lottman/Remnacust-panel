name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      NODE_PATH: ${{ github.workspace }}/panel/frontend/node_modules
    defaults:
      run:
        working-directory: panel/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: panel/frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ../backend
      - run: npm run migrate:generate --prefix ../backend
      - run: npm run typecheck
      - run: node --test tests/*.test.cjs tests/*.test.mjs scripts/*.test.cjs
      - run: npm run i18n:check
      - run: npm run docs:check
      - run: npm run cb
  backend:
    runs-on: ubuntu-latest
    env:
      REMNACUST_NODE_SOURCE: ${{ github.workspace }}/node-repository/node
      NODE_INCIDENT_TEST_REDIS_URL: redis://127.0.0.1:56381/15
      TEMPLATE_CACHE_TEST_REDIS_URL: redis://127.0.0.1:56382/15
    services:
      valkey:
        image: valkey/valkey:9-alpine
        ports:
          - 56381:6379
          - 56382:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: mirror.gcr.io/library/postgres:17.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: panel/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lottman/Remnacust-node
          ref: 3b4eca25f02986693bea7b714ba1e51e3dc326e3
          path: node-repository
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
      - run: npm ci
      - run: npm ci --prefix ../frontend
      - run: npm ci --prefix ../../node-repository/node
      - run: npm ci --prefix ../../subscription-page/backend
      - run: npm run migrate:generate
      - run: npm run typecheck
      - run: node --test tests/*.test.cjs
      - name: Verify template cache generations across API workers
        run: node tests/subscription-template-cache-redis.integration.cjs
      - name: Verify route inventory does not wait for the billing transaction pool
        env:
          REMNACUST_ROUTE_POOL_TEST_URL: postgresql://postgres@127.0.0.1:55439/rc_route_pool_ci
        run: |
          node - <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const database = new Client({ connectionString: 'postgresql://postgres@127.0.0.1:55439/postgres' });
            await database.connect();
            try { await database.query('CREATE DATABASE rc_route_pool_ci'); }
            finally { await database.end(); }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
          node --test tests/node-route-pool.database.integration.cjs
      - name: Verify subscription domain access schema under a restricted owner
        env:
          DOMAIN_ACCESS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55439/postgres
        run: node --test tests/subscription-domain-access.database.integration.cjs tests/subscription-domain-retirement.database.integration.cjs
      - name: Verify domain retirement and competing close requests with restricted Prisma clients
        env:
          DATABASE_URL: postgresql://rc_retirement_ci@127.0.0.1:55439/remnacust_test_domain_retirement
          DOMAIN_RETIREMENT_SERVICE_DATABASE_URL: postgresql://rc_retirement_ci@127.0.0.1:55439/remnacust_test_domain_retirement
        run: |
          node <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const client = new Client({ connectionString: 'postgresql://postgres@127.0.0.1:55439/postgres' });
            await client.connect();
            try {
              await client.query('CREATE ROLE rc_retirement_ci LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE');
              await client.query('CREATE DATABASE remnacust_test_domain_retirement OWNER rc_retirement_ci');
            } finally { await client.end(); }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
          npm run migrate:deploy
          node --test tests/subscription-domain-retirement-service.database.integration.cjs
      - name: Check private Xray IPC and certificate files on Linux
        run: sudo --preserve-env=REMNACUST_NODE_SOURCE "$(command -v node)" --test tests/node-api-socket.test.cjs tests/pem-file-security.test.cjs tests/node-upgrade-script.test.cjs tests/node-install-script.test.cjs
      - name: Verify documentation against freshly generated backend contract
        run: |
          npm run generate:openapi
          node ../frontend/docs-tools/check-documentation.mjs
      - run: npm run build
      - name: Verify response-time autoselect with the native Xray core
        env:
          REMNACUST_AUTOPROBE_CORE: ${{ runner.temp }}/remnacust-response-time-core
        run: |
          curl --fail --location --proto '=https' --proto-redir '=https' --max-filesize 201326592 https://github.com/lottman/Remnacust-core/releases/download/v1.1.16/remnacust-core-1.1.16-linux-amd64 -o "$REMNACUST_AUTOPROBE_CORE"
          printf 'f8ca5d7da286caf83c90d195c018ed2a3d3c97da3d405f05ebf031f1d60bf2c9  %s\n' "$REMNACUST_AUTOPROBE_CORE" | sha256sum -c
          chmod 755 "$REMNACUST_AUTOPROBE_CORE"
          node tests/autoselect-http-probe.integration.cjs
          node tests/autoselect-http-probe.integration.cjs --burst
      - name: Apply migrations to the disposable test database
        run: npm run migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:55439/postgres
          DIRECT_URL: postgresql://postgres@127.0.0.1:55439/postgres
      - name: Verify frozen lifetime database transitions and generated remote installer
        run: |
          node tests/frozen-user-lifetime.database.integration.cjs
          sudo env NODE_INSTALL_TEST_LINUX=1 "$(command -v node)" tests/node-upgrade-script.integration.cjs
        env:
          FROZEN_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55439/postgres
          NODE_INSTALL_TEST_LINUX: '1'
      - name: Verify serialized Xray mode changes with restricted PostgreSQL writers
        env:
          XRAY_MODE_TEST_DATABASE_URL: postgresql://mode_guard_owner@127.0.0.1:55439/xray_mode_guard_test
          XRAY_MODE_TEST_PG_MAJOR: '17'
        run: |
          node - <<'NODE'
          const {Client}=require('pg');
          (async()=>{const client=new Client({connectionString:'postgresql://postgres@127.0.0.1:55439/postgres'});await client.connect();try{await client.query('CREATE ROLE mode_guard_owner LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE');await client.query('CREATE DATABASE xray_mode_guard_test OWNER mode_guard_owner');}finally{await client.end();}})().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
          DATABASE_URL="$XRAY_MODE_TEST_DATABASE_URL" DIRECT_URL="$XRAY_MODE_TEST_DATABASE_URL" npm run migrate:deploy
          node --test tests/xray-mode-serialization.database.integration.cjs
      - name: Check access policies and limits with PostgreSQL
        run: node tests/hwid-default-database.integration.cjs && node tests/host-policy-database.integration.cjs && node tests/limit-management-database.integration.cjs && node tests/device-reconciliation-database.integration.cjs && node tests/node-health-retention-database.integration.cjs
      - name: Check bidirectional subscription domain synchronization with PostgreSQL
        run: |
          node - <<'NODE'
          const {PrismaClient}=require('./tests/prisma-test-client.cjs');
          const database=new PrismaClient({datasourceUrl:'postgresql://postgres@127.0.0.1:55439/postgres'});
          (async()=>{try{await database.$executeRawUnsafe('CREATE DATABASE remnacust_test_subscription_domains');}finally{await database.$disconnect();}})().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
          npm run migrate:deploy
          node tests/subscription-domains-database.integration.cjs
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:55439/remnacust_test_subscription_domains
          DIRECT_URL: postgresql://postgres@127.0.0.1:55439/remnacust_test_subscription_domains
          SUBSCRIPTION_DOMAINS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55439/remnacust_test_subscription_domains
      - name: Check concurrent geofile imports across API processes
        run: |
          node - <<'NODE'
          const {PrismaClient}=require('./tests/prisma-test-client.cjs');
          const database=new PrismaClient({datasourceUrl:'postgresql://postgres@127.0.0.1:55439/postgres'});
          (async()=>{try{await database.$executeRawUnsafe('CREATE DATABASE remnacust_test_geofiles');}finally{await database.$disconnect();}})().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
          node --test tests/geofiles-concurrent-import.integration.cjs
        env:
          TEST_GEOFILES_DATABASE_URL: postgresql://postgres@127.0.0.1:55439/remnacust_test_geofiles
      - name: Check hidden host injection with PostgreSQL
        run: node tests/xray-hidden-hosts-database.integration.cjs
        env:
          XRAY_INJECTION_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55439/postgres
      - name: Check hidden connection key visibility with PostgreSQL
        run: node tests/subpage-config-visibility.database.integration.cjs
      - name: Compare batch identity authorization against scalar access rules with PostgreSQL
        run: node tests/identity-access-database.integration.cjs && node tests/inbound-access-database.integration.cjs && node tests/access-expiry-timezone.database.integration.cjs && node tests/subscription-load-database.integration.cjs
      - name: Check template history, restore and upgrade preservation with PostgreSQL
        run: node tests/template-history-database.integration.cjs
        env:
          TEMPLATE_HISTORY_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55439/postgres
      - name: Verify bounded receipt commits and batched quota epochs with PostgreSQL
        run: |
          node - <<'NODE'
          const {PrismaClient}=require('./tests/prisma-test-client.cjs');
          const database=new PrismaClient({datasourceUrl:'postgresql://postgres@127.0.0.1:55439/postgres'});
          (async()=>{try{
            await database.$executeRawUnsafe('CREATE DATABASE remnacust_test_host_usage_batch');
            await database.$executeRawUnsafe('CREATE DATABASE remnacust_test_quota_policy_batch');
          }finally{await database.$disconnect();}})().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
          DATABASE_URL=postgresql://postgres@127.0.0.1:55439/remnacust_test_host_usage_batch DIRECT_URL=postgresql://postgres@127.0.0.1:55439/remnacust_test_host_usage_batch npm run migrate:deploy
          HOST_USAGE_PROGRESS_TEST_DATABASE_URL=postgresql://postgres@127.0.0.1:55439/remnacust_test_host_usage_batch node tests/host-usage-progress.database.integration.cjs
          DATABASE_URL=postgresql://postgres@127.0.0.1:55439/remnacust_test_quota_policy_batch DIRECT_URL=postgresql://postgres@127.0.0.1:55439/remnacust_test_quota_policy_batch npm run migrate:deploy
          QUOTA_POLICY_BATCH_TEST_DATABASE_URL=postgresql://postgres@127.0.0.1:55439/remnacust_test_quota_policy_batch node tests/quota-policy-batching-database.integration.cjs
      - name: Restore compact database backup and verify retained credentials
        run: node tests/backup-dump-database.integration.cjs
      - name: Check durable quota reservation issuance in a separate empty database
        run: |
          node - <<'NODE'
          const {PrismaClient}=require('./tests/prisma-test-client.cjs');
          const database=new PrismaClient({datasourceUrl:'postgresql://postgres@127.0.0.1:55439/postgres'});
          (async()=>{try{await database.$executeRawUnsafe('CREATE DATABASE remnacust_quota_reserves_test');}finally{await database.$disconnect();}})().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
          npm run migrate:deploy
          node tests/prisma-pg-timezone.database.integration.cjs
          node tests/quota-reserves-database.integration.cjs
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:55439/remnacust_quota_reserves_test
          DIRECT_URL: postgresql://postgres@127.0.0.1:55439/remnacust_quota_reserves_test
          QUOTA_RESERVES_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55439/remnacust_quota_reserves_test
      - name: Check global user reserves and native checkpoint acknowledgement in an empty database
        run: |
          node - <<'NODE'
          const {PrismaClient}=require('./tests/prisma-test-client.cjs');
          const database=new PrismaClient({datasourceUrl:'postgresql://postgres@127.0.0.1:55439/postgres'});
          (async()=>{try{await database.$executeRawUnsafe('CREATE DATABASE remnacust_global_quota_test');}finally{await database.$disconnect();}})().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
          npm run migrate:deploy
          node tests/user-quota-database.integration.cjs
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:55439/remnacust_global_quota_test
          DIRECT_URL: postgresql://postgres@127.0.0.1:55439/remnacust_global_quota_test
          USER_QUOTA_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55439/remnacust_global_quota_test
      - name: Check legacy usage cutover, rollback and old queue retries with PostgreSQL
        run: |
          node - <<'NODE'
          const {PrismaClient}=require('./tests/prisma-test-client.cjs');
          const database=new PrismaClient({datasourceUrl:'postgresql://postgres@127.0.0.1:55439/postgres'});
          (async()=>{try{await database.$executeRawUnsafe('CREATE DATABASE remnacust_legacy_usage_test');}finally{await database.$disconnect();}})().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
          npm run migrate:deploy
          node tests/legacy-usage-database.integration.cjs
          node tests/quota-cutover-database.integration.cjs
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:55439/remnacust_legacy_usage_test
          DIRECT_URL: postgresql://postgres@127.0.0.1:55439/remnacust_legacy_usage_test
          LEGACY_USAGE_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55439/remnacust_legacy_usage_test
          QUOTA_CUTOVER_TEST_REDIS_URL: redis://127.0.0.1:56381/15
      - name: Check legacy billing and destructive collection during restore in a separate database
        run: |
          node - <<'NODE'
          const {PrismaClient}=require('./tests/prisma-test-client.cjs');
          const database=new PrismaClient({datasourceUrl:'postgresql://postgres@127.0.0.1:55439/postgres'});
          (async()=>{try{await database.$executeRawUnsafe('CREATE DATABASE remnacust_legacy_recovery_test');}finally{await database.$disconnect();}})().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
          npm run migrate:deploy
          node tests/legacy-usage-database.integration.cjs
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:55439/remnacust_legacy_recovery_test
          DIRECT_URL: postgresql://postgres@127.0.0.1:55439/remnacust_legacy_recovery_test
          LEGACY_USAGE_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55439/remnacust_legacy_recovery_test
      - name: Check explicit legacy accounting recovery decisions in an empty database
        run: |
          node - <<'NODE'
          const {PrismaClient}=require('./tests/prisma-test-client.cjs');
          const database=new PrismaClient({datasourceUrl:'postgresql://postgres@127.0.0.1:55439/postgres'});
          (async()=>{try{await database.$executeRawUnsafe('CREATE DATABASE remnacust_legacy_decisions_test');}finally{await database.$disconnect();}})().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
          npm run migrate:deploy
          node tests/legacy-quota-recovery-database.integration.cjs
          node tests/legacy-queue-recovery-database.integration.cjs
          node tests/quota-recovery-bank-database.integration.cjs
          node tests/quota-bank-storage-database.integration.cjs
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:55439/remnacust_legacy_decisions_test
          DIRECT_URL: postgresql://postgres@127.0.0.1:55439/remnacust_legacy_decisions_test
          LEGACY_QUOTA_RECOVERY_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55439/remnacust_legacy_decisions_test
          LEGACY_QUEUE_RECOVERY_TEST_REDIS_URL: redis://127.0.0.1:56381/15
      - name: Check approved native receipt recovery without ACK or global resume
        run: |
          node - <<'NODE'
          const {PrismaClient}=require('./tests/prisma-test-client.cjs');
          const database=new PrismaClient({datasourceUrl:'postgresql://postgres@127.0.0.1:55439/postgres'});
          (async()=>{try{await database.$executeRawUnsafe('CREATE DATABASE remnacust_native_recovery_test');}finally{await database.$disconnect();}})().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
          npm run migrate:deploy
          node tests/native-quota-recovery-database.integration.cjs
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:55439/remnacust_native_recovery_test
          DIRECT_URL: postgresql://postgres@127.0.0.1:55439/remnacust_native_recovery_test
          NATIVE_QUOTA_RECOVERY_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55439/remnacust_native_recovery_test
      - name: Check reviewed native quota settlements while recovery remains pending
        run: |
          node - <<'NODE'
          const {PrismaClient}=require('./tests/prisma-test-client.cjs');
          const database=new PrismaClient({datasourceUrl:'postgresql://postgres@127.0.0.1:55439/postgres'});
          (async()=>{try{await database.$executeRawUnsafe('CREATE DATABASE remnacust_recovery_settlement_test');}finally{await database.$disconnect();}})().catch(error=>{console.error(error);process.exitCode=1;});
