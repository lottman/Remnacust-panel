        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:55439/remnacust_receipt_archive_test
          DIRECT_URL: postgresql://postgres@127.0.0.1:55439/remnacust_receipt_archive_test
          QUOTA_RECEIPT_ARCHIVE_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55439/remnacust_receipt_archive_test
  subscription-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
      - run: npm ci && npm run typecheck
        working-directory: subscription-page/backend
      - run: npm ci --include=dev && npm run typecheck && npm run cb
        working-directory: subscription-page/frontend
        env:
          NODE_ENV: production
      - run: node --test tests/*.test.cjs
        working-directory: subscription-page/backend
      - run: node --test tests/*.test.cjs
        working-directory: subscription-page/frontend
  postgres-compatibility:
    name: PostgreSQL ${{ matrix.postgres }} focused checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        postgres: ['14.24', '15.19', '16.15', '17.11', '18.6']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:55439:5432'
        options: >-
          --cpus=2 --memory=1g --pids-limit=160 --shm-size=128m
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://remnacust_ci_owner@127.0.0.1:55439/postgres?connection_limit=8&pool_timeout=10
      DIRECT_URL: postgresql://remnacust_ci_owner@127.0.0.1:55439/postgres?connection_limit=8&pool_timeout=10
      SYSTEM_DIAGNOSTICS_TEST_ADMIN_URL: postgresql://postgres@127.0.0.1:55439/postgres?connection_limit=1&pool_timeout=5
    defaults:
      run:
        working-directory: panel/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: panel/backend/package-lock.json
      - run: npm ci
      - run: npm run migrate:generate
      - name: Create a non-superuser database owner
        run: |
          node - <<'NODE'
          const { PrismaClient } = require('./tests/prisma-test-client.cjs');
          const admin = new PrismaClient({ datasourceUrl: process.env.SYSTEM_DIAGNOSTICS_TEST_ADMIN_URL });
          (async () => {
            try {
              await admin.$executeRaw`CREATE ROLE remnacust_ci_owner LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT`;
              await admin.$executeRaw`ALTER DATABASE postgres OWNER TO remnacust_ci_owner`;
              await admin.$executeRaw`GRANT USAGE, CREATE ON SCHEMA public TO remnacust_ci_owner`;
            } finally {
              await admin.$disconnect();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - run: npm run migrate:deploy
      - name: Verify migration coverage and owner privileges
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const { PrismaClient } = require('./tests/prisma-test-client.cjs');
          const database = new PrismaClient();
          (async () => {
            try {
              const [role] = await database.$queryRaw`SELECT current_user AS name, rolsuper, rolcreatedb, rolcreaterole FROM pg_roles WHERE rolname = current_user`;
              assert.deepEqual(role, { name: 'remnacust_ci_owner', rolsuper: false, rolcreatedb: false, rolcreaterole: false });
              const migrations = fs.readdirSync('prisma/migrations').filter(name => fs.existsSync(path.join('prisma/migrations', name, 'migration.sql')));
              const [applied] = await database.$queryRaw`SELECT count(*)::integer AS count FROM _prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL`;
              assert.equal(applied.count, migrations.length);
            } finally {
              await database.$disconnect();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Verify geofile opt-in invariants and concurrent changes
        run: node --test tests/geofiles-opt-in.database.integration.cjs
        env:
          GEOFILES_OPTIN_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          GEOFILES_OPTIN_TEST_DISPOSABLE: '1'
      - name: Verify quota scope migration semantics
        run: node tests/quota-scope-indexes.database.integration.cjs
      - name: Verify transactional template cache revisions
        run: node tests/template-cache-revision.database.integration.cjs
        env:
          TEMPLATE_CACHE_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          TEMPLATE_CACHE_TEST_DISPOSABLE: '1'
          TEMPLATE_CACHE_TEST_PG_VERSION: ${{ matrix.postgres }}
      - name: Verify host metadata freshness and bounded identity scans
        run: node --test tests/host-policy-metadata.database.integration.cjs
        env:
          HOST_POLICY_METADATA_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          HOST_POLICY_METADATA_TEST_DISPOSABLE: '1'
      - name: Verify public user URLs and CDN selection with actual SQL
        run: node --test tests/user-subscription-url.database.integration.cjs
        env:
          USER_SUBSCRIPTION_URL_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          USER_SUBSCRIPTION_URL_TEST_DISPOSABLE: '1'
          USER_SUBSCRIPTION_CDN_LIMIT_TEST: '1'
      - name: Verify UTC access and expiry boundaries
        run: node tests/access-expiry-timezone.database.integration.cjs
      - name: Verify actual diagnostics SQL with restricted roles
        run: node tests/system-diagnostics.database.integration.cjs
