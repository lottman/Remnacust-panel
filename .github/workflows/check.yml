          DIRECT_URL: postgresql://postgres@127.0.0.1:55439/remnacust_watermark_test
          QUOTA_JOURNAL_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:55439/remnacust_watermark_test
      - name: Inspect restored quota journals without changing reserves or the restore barrier
